<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxury Love | Polina</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at center, #1a0010 0%, #000 90%); font-family: "Georgia", serif; }
        #ui { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); padding: 18px 50px; background: rgba(255,255,255,0.02); backdrop-filter: blur(20px); border-radius: 100px; color: #fff; font-size: 16px; letter-spacing: 6px; border: 1px solid rgba(255,182,193,0.25); cursor: pointer; z-index: 100; transition: 0.8s; -webkit-tap-highlight-color: transparent; text-transform: uppercase; }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; padding: 30px; background: rgba(255,255,255,0.05); backdrop-filter: blur(30px); border-radius: 30px; border: 1px solid rgba(255,182,193,0.3); text-align: center; color: white; z-index: 1000; }
        .confirm-btn { background: none; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 12px 24px; border-radius: 40px; cursor: pointer; margin: 10px; font-weight: bold; font-family: sans-serif; }
        #final-msg { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; letter-spacing: 4px; opacity: 0; transition: 1s; z-index: 2000; text-align: center; width: 100%; font-style: italic; }
    </style>
</head>
<body>

<div id="ui">ПОСМОТРЕТЬ МАГИЮ</div>
<div id="modal">
    <h2>Уверена?</h2>
    <button class="confirm-btn" onclick="confirmAction('yes')">Да</button>
    <button class="confirm-btn" onclick="confirmAction('no')">Нет</button>
</div>
<div id="final-msg">Умничка, люблю тебя</div>

<audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_c8c8a73467.mp3">
</audio>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three"

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000)
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" })

renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)) 
document.body.appendChild(renderer.domElement)

camera.position.z = 45

const words = [
    "ЛЮБИМАЯ", "POLINA", "МОЯ", "MINE", "ТОЛЬКО МОЯ", "ONLY YOU", "РОДНАЯ", "MY GIRL", 
    "С ТОБОЙ ДО КОНЦА", "RIDE OR DIE", "LOYALTY", "МОЯ ЗАЙКА", 
    "MY QUEEN", "САМАЯ ЛЮБИМАЯ МОЯ", "PROTECT YOU", "МОЯ МАЛЕНЬКАЯ", "FOREVER", 
    "ЕДИНСТВЕННАЯ", "THE ONE", "ТЫ В МОЁМ СЕРДЦЕ", "SOULMATE", "НИКОМУ НЕ ОТДАМ", 
    "MY EVERYTHING", "МОЯ ДЕВОЧКА", "TRUE VIBE", "ЛЮБЛЮ", "LOVE YOU", "ОДНА НА МИЛЛИОН", 
    "YOU & ME", "МОЯ КРАСОТКА", "GORGEOUS", "ОБОЖАЮ ТЕБЯ ЛЮБИТЬ", "KEEP IT REAL"
];

const glowTex = (() => {
    const c = document.createElement("canvas"); c.width = 64; c.height = 64;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,"white"); g.addColorStop(.3,"pink"); g.addColorStop(1,"transparent");
    ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
})();

const COUNT = 4000;
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(COUNT * 3);
const target = new Float32Array(COUNT * 3);
const vel = new Float32Array(COUNT * 3);

for(let i=0; i<COUNT; i++){
    pos[i*3] = (Math.random()-.5)*120;
    pos[i*3+1] = (Math.random()-.5)*120;
    pos[i*3+2] = (Math.random()-.5)*120;
    const t = Math.random()*Math.PI*2;
    const r = .5 + Math.random()*.05;
    target[i*3] = 16*Math.pow(Math.sin(t),3)*r;
    target[i*3+1] = (13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*r;
    target[i*3+2] = (Math.random()-.5)*4;
}

geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const mat = new THREE.PointsMaterial({ size: 0.35, map: glowTex, transparent: true, blending: THREE.AdditiveBlending, color: 0xff88bb, depthWrite: false });
const points = new THREE.Points(geo, mat);
scene.add(points);

const phrases = [];
const textCanvas = document.createElement("canvas");
textCanvas.width = 512; textCanvas.height = 128;
const textCtx = textCanvas.getContext("2d");

function createText(text) {
    textCtx.clearRect(0,0,512,128);
    
    // Эффекты шрифта
    textCtx.shadowColor = "#ff2bd6";
    textCtx.shadowBlur = 20;
    
    const grad = textCtx.createLinearGradient(0,0,512,0);
    grad.addColorStop(0.2, "#fff0f5"); 
    grad.addColorStop(0.5, "#ffffff"); 
    grad.addColorStop(0.8, "#ffb6c1");
    
    textCtx.fillStyle = grad;
    // Используем Georgia Bold Italic для премиального вида
    textCtx.font = "italic bold 56px Georgia, serif"; 
    textCtx.textAlign = "center";
    
    // Легкий контур для четкости
    textCtx.strokeStyle = "rgba(255, 255, 255, 0.3)";
    textCtx.lineWidth = 1;
    textCtx.strokeText(text, 256, 85);
    textCtx.fillText(text, 256, 85);
    
    const tex = new THREE.CanvasTexture(textCanvas);
    const m = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
    const s = new THREE.Sprite(m);
    s.scale.set(14, 3.5, 1);
    return s;
}

function spawn() {
    if(phrases.length > 35) return; 
    const s = createText(words[Math.floor(Math.random()*words.length)]);
    s.position.set((Math.random()-.5)*55, 35, (Math.random()-.5)*20);
    scene.add(s);
    phrases.push({ obj: s, v: 0.12 + Math.random()*0.1, sin: Math.random()*Math.PI, amp: 0.06 });
}

let stage = 0, timer = 0;

function animate() {
    const now = performance.now();
    const t = now * 0.001;
    const arr = geo.attributes.position.array;

    camera.position.x = Math.sin(t*0.2)*5;
    camera.position.z = 42 + Math.cos(t*0.3)*5;
    camera.lookAt(0,0,0);

    if(stage === 1) {
        for(let i=0; i<COUNT*3; i++) arr[i] += (target[i]-arr[i])*0.07;
        if(now - timer > 3500) { stage = 2; timer = now; }
    } 
    else if(stage === 2) {
        const b = 1 + Math.pow(Math.sin(t*1.8), 12)*0.12;
        points.scale.set(b,b,b);
        if(now - timer > 4500) {
            stage = 3;
            for(let i=0; i<COUNT; i++) {
                const angle = Math.random()*Math.PI*2;
                const force = 0.6 + Math.random();
                vel[i*3] = Math.cos(angle)*force;
                vel[i*3+1] = Math.sin(angle)*force;
                vel[i*3+2] = (Math.random()-.5)*force;
            }
        }
    } 
    else if(stage === 3) {
        for(let i=0; i<COUNT; i++) {
            arr[i*3] += vel[i*3];
            arr[i*3+1] += vel[i*3+1] - 0.02;
            arr[i*3+2] += vel[i*3+2];
        }
        mat.opacity *= 0.996;
        if(Math.random() > 0.85) spawn(); 
    }

    for(let i = phrases.length - 1; i >= 0; i--) {
        const p = phrases[i];
        p.obj.position.y -= p.v;
        p.obj.position.x += Math.sin(t + p.sin)*p.amp;
        p.obj.material.opacity = Math.min(p.obj.material.opacity + 0.04, 1);
        if(p.obj.position.y < -38) {
            scene.remove(p.obj);
            p.obj.material.map.dispose();
            p.obj.material.dispose();
            phrases.splice(i, 1);
        }
    }

    geo.attributes.position.needsUpdate = true;
    points.rotation.y += 0.003;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

animate();

const ui = document.getElementById("ui");
const modal = document.getElementById("modal");
const finalMsg = document.getElementById("final-msg");

ui.onclick = () => { ui.style.display = "none"; modal.style.display = "block"; };

window.confirmAction = (choice) => {
    modal.style.display = "none";
    finalMsg.style.opacity = "1";
    if(choice === "no") finalMsg.innerText = "Хах, ну ну.........";
    setTimeout(() => {
        finalMsg.style.opacity = "0";
        document.getElementById("music").play();
        stage = 1; timer = performance.now();
    }, 2000);
};

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
