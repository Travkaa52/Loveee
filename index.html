<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Love | Polina</title>

<style>

body{
margin:0;
overflow:hidden;
background:radial-gradient(circle at center,#1a0010 0%,#000 90%);
font-family:serif;
}

#ui{
position:absolute;
bottom:12%;
left:50%;
transform:translateX(-50%);
padding:18px 50px;
background:rgba(255,255,255,0.02);
backdrop-filter:blur(20px);
border-radius:100px;
color:#fff;
font-size:16px;
letter-spacing:6px;
border:1px solid rgba(255,182,193,0.25);
cursor:pointer;
z-index:100;
transition:0.8s;
}

#ui:hover{
letter-spacing:10px;
border-color:#ffb6c1;
}

#modal{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:320px;
padding:30px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(30px);
border-radius:30px;
border:1px solid rgba(255,182,193,0.3);
text-align:center;
color:white;
z-index:1000;
}

.confirm-btn{
background:none;
border:1px solid rgba(255,255,255,0.4);
color:white;
padding:10px 20px;
border-radius:40px;
cursor:pointer;
margin:10px;
}

.confirm-btn:hover{
background:white;
color:black;
}

#final-msg{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:30px;
letter-spacing:6px;
opacity:0;
transition:1s;
z-index:2000;
}

</style>

</head>

<body>

<div id="ui">Unveil the Magic</div>

<div id="modal">
<h2>Ты уверена, что хочешь увидеть магию?</h2>
<button class="confirm-btn" onclick="confirmAction('yes')">Да</button>
<button class="confirm-btn" onclick="confirmAction('no')">Нет</button>
</div>

<div id="final-msg">Умничка</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_c8c8a73467.mp3">
</audio>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">

import * as THREE from "three"

const scene=new THREE.Scene()

const camera=new THREE.PerspectiveCamera(
50,
window.innerWidth/window.innerHeight,
0.1,
1000
)

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})
renderer.setSize(window.innerWidth,window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5))
document.body.appendChild(renderer.domElement)

camera.position.z=45

function glowTexture(){

const c=document.createElement("canvas")
c.width=64
c.height=64

const ctx=c.getContext("2d")

const g=ctx.createRadialGradient(32,32,0,32,32,32)

g.addColorStop(0,"white")
g.addColorStop(.3,"pink")
g.addColorStop(1,"transparent")

ctx.fillStyle=g
ctx.fillRect(0,0,64,64)

return new THREE.CanvasTexture(c)

}

const tex=glowTexture()

const COUNT=5000

const geo=new THREE.BufferGeometry()

const pos=new Float32Array(COUNT*3)
const target=new Float32Array(COUNT*3)
const vel=new Float32Array(COUNT*3)

for(let i=0;i<COUNT;i++){

pos[i*3]=(Math.random()-.5)*120
pos[i*3+1]=(Math.random()-.5)*120
pos[i*3+2]=(Math.random()-.5)*120

const t=Math.random()*Math.PI*2
const r=.5+Math.random()*.05

target[i*3]=16*Math.pow(Math.sin(t),3)*r
target[i*3+1]=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*r
target[i*3+2]=(Math.random()-.5)*4

}

geo.setAttribute("position",new THREE.BufferAttribute(pos,3))

const mat=new THREE.PointsMaterial({
size:.3,
map:tex,
transparent:true,
blending:THREE.AdditiveBlending,
color:0xff88bb,
depthWrite:false
})

const points=new THREE.Points(geo,mat)
scene.add(points)

const words=[
"POLINA",
"I LOVE YOU",
"FOREVER",
"MY QUEEN",
"YOU ARE BEAUTIFUL",
"MY SOUL",
"MY HEART",
"ALWAYS YOURS",
"ANGEL",
"LOVE FOREVER"
]

const phrases=[]

function createText(text){

const c=document.createElement("canvas")
c.width=1024
c.height=256

const ctx=c.getContext("2d")

ctx.shadowColor="#ff2bd6"
ctx.shadowBlur=30

const grad=ctx.createLinearGradient(0,0,1024,0)

grad.addColorStop(.3,"#fff0f5")
grad.addColorStop(.5,"#ffffff")
grad.addColorStop(.7,"#ffb6c1")

ctx.fillStyle=grad

ctx.font="italic 80px Georgia"

ctx.textAlign="center"

ctx.fillText(text,512,150)

const tex=new THREE.CanvasTexture(c)

const m=new THREE.SpriteMaterial({
map:tex,
transparent:true,
opacity:0,
blending:THREE.AdditiveBlending
})

const s=new THREE.Sprite(m)

s.scale.set(14,3.5,1)

return s

}

function spawn(){

const s=createText(words[Math.floor(Math.random()*words.length)])

s.position.set(
(Math.random()-.5)*45,
30,
(Math.random()-.5)*20
)

scene.add(s)

phrases.push({
obj:s,
v:.1,
sin:Math.random()*Math.PI,
amp:.03
})

}

let stage=0
let timer=0

function animate(){

const now=performance.now()
const t=now*.001

const arr=geo.attributes.position.array

camera.position.x=Math.sin(t*.2)*8
camera.position.z=45+Math.cos(t*.3)*5

camera.lookAt(0,0,0)

if(stage===1){

for(let i=0;i<COUNT*3;i++)
arr[i]+=(target[i]-arr[i])*.05

if(now-timer>3500){
stage=2
timer=now
}

}

else if(stage===2){

const b=1+Math.pow(Math.sin(t*1.8),12)*.15
points.scale.set(b,b,b)

if(now-timer>4500){

stage=3

for(let i=0;i<COUNT;i++){

const angle=Math.random()*Math.PI*2
const force=.5+Math.random()*1.2

vel[i*3]=Math.cos(angle)*force
vel[i*3+1]=Math.sin(angle)*force
vel[i*3+2]=(Math.random()-.5)*force

}

}

}

else if(stage===3){

for(let i=0;i<COUNT;i++){

arr[i*3]+=vel[i*3]
arr[i*3+1]+=vel[i*3+1]-.03
arr[i*3+2]+=vel[i*3+2]

vel[i*3]*=.98
vel[i*3+1]*=.98

}

mat.opacity*=.992

if(Math.random()>.94)spawn()

}

for(let i=phrases.length-1;i>=0;i--){

const p=phrases[i]

p.obj.position.y-=p.v
p.obj.position.x+=Math.sin(t+p.sin)*p.amp

p.obj.material.opacity=Math.min(p.obj.material.opacity+.03,1)

if(p.obj.position.y<-30){

scene.remove(p.obj)
phrases.splice(i,1)

}

}

geo.attributes.position.needsUpdate=true

points.rotation.y+=.004

renderer.render(scene,camera)

requestAnimationFrame(animate)

}

animate()

const ui=document.getElementById("ui")
const modal=document.getElementById("modal")
const finalMsg=document.getElementById("final-msg")

ui.onclick=()=>{
ui.style.display="none"
modal.style.display="block"
}

window.confirmAction=function(choice){

modal.style.display="none"

finalMsg.style.opacity="1"

if(choice==="no")
finalMsg.innerText="Всё равно нажми :)"

setTimeout(()=>{

finalMsg.style.opacity="0"

document.getElementById("music").play()

stage=1
timer=performance.now()

},2000)

}

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)

})

</script>

</body>
</html> оптимизируй код под айфон 14 про макс
